<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leicester Square Station: Energy Positive Hub Simulation</title>
    <!-- Tailwind CSS CDN for modern UI architecture -->
    <script src="https://jsdelivr.net"></script>
    <style>
        /* CSS Keyframe Engines for Live Elements */
        @keyframes spin-linear {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .turbine-blade {
            animation: spin-linear 2s linear infinite;
            transform-origin: center;
            transform-box: fill-box;
        }
        .flow-line {
            stroke-dasharray: 8, 4;
            animation: dash 1s linear infinite;
        }
        @keyframes dash {
            to { stroke-dashoffset: -12; }
        }
        .passenger-particle {
            transition: all 0.4s linear;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased">

    <!-- Global Application Header -->
    <header class="border-b border-slate-800 bg-slate-900/50 backdrop-blur p-6 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div>
                <div class="flex items-center gap-2 text-emerald-400 font-semibold uppercase tracking-wider text-xs mb-1">
                    <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
                    Portfolio Live Production System
                </div>
                <h1 class="text-2xl font-bold tracking-tight text-white">Leicester Square Station Layout</h1>
                <p class="text-sm text-slate-400">Real-Time Energy Recovering Hub Architecture Simulation</p>
            </div>
            
            <!-- Real-Time Interactive Simulation Parameter Modifiers -->
            <div class="flex flex-wrap items-center gap-6 bg-slate-950 p-4 rounded-xl border border-slate-800 w-full md:w-auto">
                <div class="flex-1 min-w-[160px]">
                    <label class="block text-xs font-medium text-slate-400 mb-1 flex justify-between">
                        <span>Commuter Density</span>
                        <span id="density-val" class="text-emerald-400 font-bold">50%</span>
                    </label>
                    <input type="range" id="param-density" min="10" max="100" value="50" class="w-full accent-emerald-500 bg-slate-800 h-1.5 rounded-lg appearance-none cursor-pointer">
                </div>
                <div class="flex-1 min-w-[160px]">
                    <label class="block text-xs font-medium text-slate-400 mb-1 flex justify-between">
                        <span>Train Headway</span>
                        <span id="freq-val" class="text-cyan-400 font-bold">2.5m</span>
                    </label>
                    <input type="range" id="param-frequency" min="1" max="5" step="0.5" value="2.5" class="w-full accent-cyan-500 bg-slate-800 h-1.5 rounded-lg appearance-none cursor-pointer">
                </div>
            </div>
        </div>
    </header>

    <!-- Workspace Grid Layout Layout Container -->
    <main class="max-w-7xl mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6">
        
        <!-- Center Sandbox Render Screen -->
        <section class="lg:col-span-8 bg-slate-900 border border-slate-800 rounded-2xl p-4 relative overflow-hidden flex flex-col justify-between min-h-[600px]">
            <div class="absolute top-4 left-4 z-10 bg-slate-950/80 backdrop-blur border border-slate-800 px-3 py-1.5 rounded-lg text-xs font-mono text-slate-300 flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-cyan-500 animate-pulse"></span>
                ISOMETRIC LAYOUT ENGINE
            </div>

            <!-- Polished High-Fidelity Architectural SVG Simulation Map -->
            <div class="w-full flex-1 flex items-center justify-center min-h-[460px] p-2">
                <svg id="station-blueprint" viewBox="0 0 800 500" class="w-full h-auto max-h-[480px]">
                    <defs>
                        <!-- Glow Gradients Matrix Definitions -->
                        <radialGradient id="hall-glow" cx="50%" cy="50%" r="50%">
                            <stop offset="0%" stop-color="#10b981" stop-opacity="0.18" />
                            <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
                        </radialGradient>
                        <linearGradient id="gradient-heat" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#ef4444" stop-opacity="0.15" />
                            <stop offset="100%" stop-color="#f97316" stop-opacity="0.0" />
                        </linearGradient>
                        <linearGradient id="gradient-battery" x1="0%" y1="100%" x2="0%" y2="0%">
                            <stop offset="0%" stop-color="#eab308" />
                            <stop id="battery-stop" offset="65%" stop-color="#eab308" />
                            <stop id="battery-empty-stop" offset="65%" stop-color="#334155" />
                            <stop offset="100%" stop-color="#334155" />
                        </linearGradient>
                        <filter id="layer-shadow" x="-10%" y="-10%" width="130%" height="130%">
                            <feDropShadow dx="0" dy="10" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
                        </filter>
                    </defs>

                    <!-- Technical Alignment Wireframes Grid Background -->
                    <g stroke="#1e293b" stroke-width="0.5" opacity="0.3">
                        <path d="M 0,100 L 800,100 M 0,200 L 800,200 M 0,300 L 800,300 M 0,400 L 800,400" />
                        <path d="M 150,0 L 150,500 M 300,0 L 300,500 M 450,0 L 450,500 M 600,0 L 600,500" />
                    </g>

                    <!-- ================= LAYER 1: HARVESTING CONSUMPTION FLOW INFRASTRUCTURE GRID LINES ================= -->
                    <!-- Inbound Power Lines To Central Battery Unit -->
                    <path d="M 180,140 Q 60,180 60,250" fill="none" stroke="#10b981" stroke-width="1.5" class="flow-line" opacity="0.7"/>
                    <path d="M 200,240 Q 120,280 60,265" fill="none" stroke="#ec4899" stroke-width="1.5" class="flow-line" opacity="0.7"/>
                    <path d="M 330,180 Q 250,220 70,255" fill="none" stroke="#f43f5e" stroke-width="1.5" class="flow-line" opacity="0.7"/>
                    <path d="M 580,120 Q 400,120 75,260" fill="none" stroke="#38bdf8" stroke-width="1.5" class="flow-line" opacity="0.7"/>
                    <path d="M 320,310 Q 200,310 70,270" fill="none" stroke="#38bdf8" stroke-width="1.5" class="flow-line" opacity="0.7"/>
                    <!-- Thermal lines -->
                    <path d="M 550,150 Q 400,250 80,265" fill="none" stroke="#f97316" stroke-width="1.5" class="flow-line" opacity="0.6"/>

                    <!-- Outbound Distribution Feeders Out from Battery -->
                    <path d="M 65,275 Q 120,380 180,410" fill="none" stroke="#a855f7" stroke-width="1.5" class="flow-line" opacity="0.8" />
                    <path d="M 50,275 Q 20,440 240,450" fill="none" stroke="#ef4444" stroke-width="1.5" class="flow-line" opacity="0.8" />
                    <path d="M 35,265 Q -20,265 10,480" fill="none" stroke="#f97316" stroke-width="1.5" class="flow-line" opacity="0.8" />

                    <!-- ================= LAYER 2: UPPER LEVEL - TICKET HALL ================= -->
                    <g id="upper-deck-group" filter="url(#layer-shadow)">
                        <!-- Main Floor Plate Geometric Form -->
                        <path d="M 70,140 L 240,100 L 340,130 L 295,190 L 150,220 Z" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
                        <!-- Active Kinetic Floor Overlay -->
                        <path id="kinetic-floor-zone" d="M 85,142 L 230,108 L 300,132 L 160,208 Z" fill="url(#hall-glow)" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4,2" />
                        <text x="95" y="130" fill="#94a3b8" font-size="11" font-weight="700" letter-spacing="0.5">TICKET HALL (KINETIC FLOORS)</text>
                    </g>

                    <!-- ================= LAYER 3: CORRECT INTERMEDIATE ESCALATOR INFRASTRUCTURE ================= -->
                    <!-- Escalators 4, 5, 6 (Explicitly Routed Down to the Northern Line Platforms Area) -->
                    <g id="escalator-456-group">
                        <line x1="270" y1="145" x2="430" y2="195" stroke="#334155" stroke-width="12" stroke-linecap="round" />
                        <line id="escalator-456-line" x1="270" y1="145" x2="430" y2="195" stroke="#f43f5e" stroke-width="3" stroke-linecap="round" class="flow-line" />
                        <text x="275" y="175" fill="#f43f5e" font-size="9" font-weight="bold" transform="rotate(17 275 175)">ESC 4,5,6 (TO NORTHERN)</text>
                    </g>

                    <!-- Escalators 1, 2, 3 (Explicitly Routed Down to the Piccadilly Line Platforms Area) -->
                    <g id="escalator-123-group">
                        <line x1="140" y1="205" x2="215" y2="305" stroke="#334155" stroke-width="12" stroke-linecap="round" />
                        <line id="escalator-123-line" x1="140" y1="205" x2="215" y2="305" stroke="#ec4899" stroke-width="3" stroke-linecap="round" class="flow-line" />
                        <text x="135" y="260" fill="#ec4899" font-size="9" font-weight="bold" transform="rotate(53 135 260)">ESC 1,2,3 (TO PICCADILLY)</text>
                    </g>

                    <!-- ================= LAYER 4: LOWER SYSTEM LEVEL - SUB-SURFACE RAILWAY PLATFORMS ================= -->
