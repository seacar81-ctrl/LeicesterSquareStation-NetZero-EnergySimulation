<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leicester Square Station: Energy Positive Hub Simulation</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://jsdelivr.net"></script>
    <style>
        @keyframes pulse-slow {
            0%, 100% { opacity: 0.2; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.05); }
        }
        @keyframes spin-clean {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .turbine-blade {
            animation: spin-clean 2s linear infinite;
            transform-origin: center;
        }
        .turbine-fast {
            animation-duration: 0.6s;
        }
        .flow-line {
            stroke-dasharray: 8, 4;
            animation: dash 1s linear infinite;
        }
        @keyframes dash {
            to { stroke-dashoffset: -12; }
        }
        .passenger {
            transition: all 0.5s linear;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans">

    <!-- Header Section -->
    <header class="border-b border-slate-800 bg-slate-900/50 backdrop-blur p-6 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div>
                <div class="flex items-center gap-2 text-emerald-400 font-semibold uppercase tracking-wider text-xs mb-1">
                    <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
                    Portfolio Live Demo
                </div>
                <h1 class="text-2xl font-bold tracking-tight text-white">Leicester Square Station</h1>
                <p class="text-sm text-slate-400">Interactive Axonometric Simulation &bull; Energy Positive Hub Architecture</p>
            </div>
            
            <!-- Global Simulation Controls -->
            <div class="flex flex-wrap items-center gap-6 bg-slate-950 p-4 rounded-xl border border-slate-800 w-full md:w-auto">
                <div class="flex-1 min-w-[150px]">
                    <label class="block text-xs font-medium text-slate-400 mb-1 flex justify-between">
                        <span>Passenger Density</span>
                        <span id="density-val" class="text-emerald-400 font-bold">50%</span>
                    </label>
                    <input type="range" id="param-density" min="10" max="100" value="50" class="w-full accent-emerald-500 bg-slate-800 h-1.5 rounded-lg appearance-none cursor-pointer">
                </div>
                <div class="flex-1 min-w-[150px]">
                    <label class="block text-xs font-medium text-slate-400 mb-1 flex justify-between">
                        <span>Train Frequency</span>
                        <span id="freq-val" class="text-cyan-400 font-bold">2.5 min</span>
                    </label>
                    <input type="range" id="param-frequency" min="1" max="5" step="0.5" value="2.5" class="w-full accent-cyan-500 bg-slate-800 h-1.5 rounded-lg appearance-none cursor-pointer">
                </div>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6">
        
        <!-- Left: Simulation Render Sandbox -->
        <section class="lg:col-span-8 bg-slate-900 border border-slate-800 rounded-2xl p-4 relative overflow-hidden flex flex-col justify-between min-h-[580px]">
            <div class="absolute top-4 left-4 z-10 bg-slate-950/80 backdrop-blur border border-slate-800 px-3 py-1.5 rounded-lg text-xs font-mono text-slate-300 flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-cyan-400 animate-pulse"></span>
                LIVE LAYOUT RENDER
            </div>

            <!-- Dynamic SVG Blueprint Layout -->
            <div class="w-full flex-1 flex items-center justify-center min-h-[420px] p-2">
                <svg id="station-blueprint" viewBox="0 0 800 500" class="w-full h-auto max-h-[460px]">
                    <!-- Definitions for gradients and symbols -->
                    <defs>
                        <linearGradient id="gradient-heat" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#ef4444" stop-opacity="0.1" />
                            <stop offset="100%" stop-color="#f97316" stop-opacity="0.0" />
                        </linearGradient>
                        <linearGradient id="gradient-battery" x1="0%" y1="100%" x2="0%" y2="0%">
                            <stop offset="0%" stop-color="#eab308" />
                            <stop id="battery-stop" offset="65%" stop-color="#eab308" />
                            <stop id="battery-empty-stop" offset="65%" stop-color="#334155" />
                            <stop offset="100%" stop-color="#334155" />
                        </linearGradient>
                    </defs>

                    <!-- Background Reference Grids for Architectural Depth -->
                    <g stroke="#1e293b" stroke-width="0.5" opacity="0.3">
                        <path d="M 0,100 L 800,100 M 0,200 L 800,200 M 0,300 L 800,300 M 0,400 L 800,400" />
                        <path d="M 150,0 L 150,500 M 300,0 L 300,500 M 450,0 L 450,500 M 600,0 L 600,500" />
                    </g>

                    <!-- ================= LAYER 1: UPPER TICKETING HALL & CONCOURSE ================= -->
                    <!-- Ticket Hall Boundary Floor Structure -->
                    <path d="M 50,140 L 220,100 L 320,130 L 280,180 L 140,210 Z" fill="#1e293b" stroke="#334155" stroke-width="1.5" opacity="0.8" />
                    <!-- Ticket Hall Kinetic Flooring Active Grid Overlay -->
                    <path id="kinetic-floor-zone" d="M 65,142 L 210,108 L 275,132 L 145,198 Z" fill="transparent" stroke="#10b981" stroke-width="1" class="transition-colors duration-300" />
                    <text x="80" y="130" fill="#94a3b8" font-size="11" font-weight="600" letter-spacing="1">TICKET HALL</text>

                    <!-- ================= LAYER 2: INTERMEDIATE ESCALATOR SYSTEMS ================= -->
                    <!-- Escalators 4, 5, 6 (Rerouted Correctly to Northern Line) -->
                    <g id="escalator-456-group">
                        <line x1="250" y1="145" x2="390" y2="195" stroke="#475569" stroke-width="14" stroke-linecap="round" />
                        <line id="escalator-456-line" x1="250" y1="145" x2="390" y2="195" stroke="#f43f5e" stroke-width="2" class="flow-line" />
                        <text x="310" y="155" fill="#f43f5e" font-size="9" font-weight="bold">ESC 4,5,6 (NORTHERN)</text>
                    </g>

                    <!-- Escalators 1, 2, 3 (Rerouted Correctly to Piccadilly Line) -->
                    <g id="escalator-123-group">
                        <line x1="130" y1="195" x2="210" y2="295" stroke="#475569" stroke-width="14" stroke-linecap="round" />
                        <line id="escalator-123-line" x1="130" y1="195" x2="210" y2="295" stroke="#ec4899" stroke-width="2" class="flow-line" />
                        <text x="110" y="260" fill="#ec4899" font-size="9" font-weight="bold" transform="rotate(50 110 260)">ESC 1,2,3 (PICCADILLY)</text>
                    </g>

                    <!-- ================= LAYER 3: LOWER RAILWAY PLATFORMS ================= -->
                    
                    <!-- NORTHERN LINE AREA (Top Right Quadrant) -->
                    <g id="northern-line-zone">
                        <!-- Tunnel Shell Structures -->
                        <path d="M 420,150 L 680,80 L 720,110 L 460,180 Z" fill="#0f172a" stroke="#1e293b" />
                        <!-- Platform Floor Matrix -->
                        <line x1="440" y1="165" x2="690" y2="95" stroke="#334155" stroke-width="8" />
                        <!-- Northern Line Train Model Tracking -->
                        <rect id="train-northern" x="450" y="145" width="75" height="14" rx="4" fill="#0284c7" opacity="0.9" transform="rotate(-15 450 145)" />
                        <!-- Northern Line Platform Ceiling Turbines -->
                        <g id="turbines-northern">
                            <circle cx="480" cy="120" r="2" fill="#38bdf8"/>
                            <path d="M480,112 L480,128 M472,120 L488,120" stroke="#38bdf8" stroke-width="1.5" class="turbine-blade turbine-fast" style="transform-box: fill-box;" />
                            <circle cx="580" cy="95" r="2" fill="#38bdf8"/>
                            <path d="M580,87 L580,103 M572,95 L588,95" stroke="#38bdf8" stroke-width="1.5" class="turbine-blade turbine-fast" style="transform-box: fill-box;" />
                        </g>
                        <text x="540" y="130" fill="#38bdf8" font-size="11" font-weight="bold">NORTHERN LINE PLATFORMS</text>
                    </g>

                    <!-- PICCADILLY LINE AREA (Bottom Left Quadrant) -->
                    <g id="piccadilly-line-zone">
                        <!-- Tunnel Shell Structures -->
                        <path d="M 160,330 L 450,250 L 520,290 L 230,370 Z" fill="#0f172a" stroke="#1e293b" />
                        <!-- Platform Floor Matrix -->
                        <line x1="190" y1="340" x2="470" y2="265" stroke="#334155" stroke-width="8" />
                        <!-- Piccadilly Line Train Model Tracking -->
                        <rect id="train-piccadilly" x="220" y="325" width="80" height="14" rx="4" fill="#1d4ed8" opacity="0.9" transform="rotate(-15 220 325)" />
                        <!-- Piccadilly Line Platform Ceiling Turbines -->
                        <g id="turbines-piccadilly">
                            <circle cx="260" cy="300" r="2" fill="#38bdf8"/>
